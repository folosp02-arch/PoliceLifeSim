<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>警察人生模擬程式 · POLICE LIFE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0c0f14; --bg2:#12161d; --line:#242b35;
    --paper:#e9e0c7; --paper-ink:#2a2418;
    --yellow:#f2b705; --blue:#3f7ea6; --red:#b3392f; --pink:#c9789a;
    --text:#e7e9ec; --text-dim:#8892a0; --text-dim2:#5c6472; --radius:2px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:radial-gradient(ellipse 900px 500px at 15% -10%, #16202a 0%, transparent 60%),var(--bg);
    color:var(--text); font-family:'Noto Sans TC',sans-serif; min-height:100vh; -webkit-font-smoothing:antialiased;
  }
  @media (prefers-reduced-motion: reduce){ *{animation-duration:0.01ms !important; transition-duration:0.01ms !important;} }
  .mono{font-family:'IBM Plex Mono',monospace;}
  .app{
    max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;
    border-left:1px solid var(--line);border-right:1px solid var(--line);
    background:repeating-linear-gradient(180deg, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px, transparent 1px, transparent 3px),var(--bg2);
  }
  .shell-head{padding:14px 18px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;background:var(--bg);}
  .shell-head .tag{font-size:11px;letter-spacing:.14em;color:var(--text-dim2);}
  .shell-head .badge{width:26px;height:26px;border:1.5px solid var(--yellow);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--yellow);flex-shrink:0;}
  .statusbar{padding:10px 18px;background:var(--bg);border-bottom:1px solid var(--line);display:none;}
  .statusbar.show{display:block;}
  .statusbar .row1{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;}
  .statusbar .rank{font-weight:900;font-size:15px;letter-spacing:.02em;}
  .statusbar .meta{font-size:11.5px;color:var(--text-dim);}
  .statbars{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
  .statitem .lbl{font-size:10px;color:var(--text-dim2);display:flex;justify-content:space-between;margin-bottom:3px;}
  .statitem .lbl b{color:var(--text-dim);font-weight:500;}
  .statitem .track{height:4px;background:#1c2129;border-radius:2px;overflow:hidden;}
  .statitem .fill{height:100%;border-radius:2px;}
  .fill.body{background:var(--yellow);} .fill.inv{background:var(--blue);} .fill.rel{background:#7fa06f;} .fill.int{background:#c98fd6;}
  .relline{margin-top:8px;font-size:11px;color:var(--pink);display:flex;align-items:center;gap:5px;}
  main{flex:1;padding:18px;display:flex;flex-direction:column;gap:16px;}
  .hero-eyebrow{font-size:11px;color:var(--yellow);letter-spacing:.16em;display:flex;align-items:center;gap:8px;}
  .hero-eyebrow::before{content:"";width:18px;height:1px;background:var(--yellow);}
  h1.title{font-size:30px;font-weight:900;line-height:1.15;margin:6px 0 4px;letter-spacing:.01em;}
  h1.title em{display:block;font-style:normal;font-size:14px;font-weight:500;color:var(--text-dim);margin-top:6px;letter-spacing:.03em;}
  .tagline{font-size:13.5px;line-height:1.75;color:var(--text-dim);border-left:2px solid var(--blue);padding-left:12px;}
  .card{background:var(--bg);border:1px solid var(--line);border-radius:var(--radius);padding:16px;}
  .field{margin-bottom:16px;} .field:last-child{margin-bottom:0;}
  .field label{display:block;font-size:11px;color:var(--text-dim2);letter-spacing:.08em;margin-bottom:8px;}
  .field input[type=text]{width:100%;background:var(--bg2);border:1px solid var(--line);color:var(--text);padding:10px 12px;font-size:14px;font-family:'Noto Sans TC',sans-serif;border-radius:var(--radius);}
  .field input[type=text]:focus{outline:2px solid var(--blue);outline-offset:1px;}
  .track-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .track-opt{border:1px solid var(--line);background:var(--bg2);padding:10px;border-radius:var(--radius);cursor:pointer;text-align:left;}
  .track-opt .icon{font-size:18px;} .track-opt .name{font-size:13px;font-weight:700;margin:5px 0 3px;} .track-opt .desc{font-size:11px;color:var(--text-dim);line-height:1.4;}
  .track-opt.sel{border-color:var(--yellow);background:#1a1710;}
  .track-opt:focus-visible{outline:2px solid var(--blue);outline-offset:2px;}
  .seedrow{display:flex;gap:8px;align-items:center;}
  .seedrow .mono{flex:1;font-size:12.5px;color:var(--text-dim);background:var(--bg2);border:1px solid var(--line);padding:9px 10px;border-radius:var(--radius);overflow-x:auto;white-space:nowrap;}
  .iconbtn{background:var(--bg2);border:1px solid var(--line);color:var(--text-dim);padding:9px 11px;border-radius:var(--radius);cursor:pointer;font-size:13px;flex-shrink:0;}
  .iconbtn:hover{border-color:var(--blue);color:var(--text);}
  .seedhint{font-size:10.5px;color:var(--text-dim2);margin-top:7px;line-height:1.5;}
  .btn-primary{width:100%;background:var(--yellow);color:#1a1400;border:none;font-weight:700;font-size:15px;padding:14px;border-radius:var(--radius);cursor:pointer;letter-spacing:.02em;font-family:'Noto Sans TC',sans-serif;}
  .btn-primary:hover{filter:brightness(1.08);}
  .disclaimer{font-size:10.5px;color:var(--text-dim2);line-height:1.6;text-align:center;padding-top:4px;}
  .stageprog{font-size:10.5px;color:var(--text-dim2);letter-spacing:.1em;display:flex;justify-content:space-between;}
  .file-card{background:var(--paper);color:var(--paper-ink);border-radius:var(--radius);padding:18px 18px 16px;position:relative;box-shadow:0 8px 22px -10px rgba(0,0,0,.55);
    background-image:repeating-linear-gradient(0deg, rgba(0,0,0,0.025) 0px, transparent 1px, transparent 26px, rgba(0,0,0,0.025) 27px);}
  .file-card::before{content:"檔案";position:absolute;top:-9px;left:16px;background:var(--red);color:#fff;font-size:10px;padding:2px 8px;letter-spacing:.1em;font-family:'IBM Plex Mono',monospace;}
  .file-card.romance::before{content:"私人";background:var(--pink);}
  .file-num{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:#6b6144;margin-bottom:8px;letter-spacing:.03em;}
  .file-title{font-size:17px;font-weight:900;margin-bottom:10px;letter-spacing:.01em;}
  .file-body{font-size:13.5px;line-height:1.85;}
  .choices{display:flex;flex-direction:column;gap:8px;}
  .choice-btn{text-align:left;background:var(--bg);border:1px solid var(--line);color:var(--text);padding:12px 14px;border-radius:var(--radius);cursor:pointer;font-family:'Noto Sans TC',sans-serif;font-size:13.5px;line-height:1.5;}
  .choice-btn:hover{border-color:var(--yellow);background:#1a1710;}
  .choice-btn:focus-visible{outline:2px solid var(--blue);outline-offset:1px;}
  .choice-btn .note{display:block;font-size:11px;color:var(--text-dim2);margin-top:4px;}
  .resolve-wrap{position:relative;display:flex;flex-direction:column;gap:14px;}
  .stamp{align-self:center;border:3px solid var(--blue);color:var(--blue);font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:15px;letter-spacing:.12em;padding:8px 20px;border-radius:6px;
    transform:rotate(-7deg) scale(0.6);opacity:0;animation:stampin .38s cubic-bezier(.2,1.6,.4,1) forwards;animation-delay:.08s;}
  .stamp.bad{border-color:var(--red);color:var(--red);} .stamp.gold{border-color:var(--yellow);color:var(--yellow);} .stamp.pink{border-color:var(--pink);color:var(--pink);}
  @keyframes stampin{0%{opacity:0;transform:rotate(-7deg) scale(0.5);}60%{opacity:1;transform:rotate(-7deg) scale(1.08);}100%{opacity:1;transform:rotate(-7deg) scale(1);}}
  .log-entry{font-size:13px;line-height:1.75;color:var(--text-dim);background:var(--bg);border:1px solid var(--line);border-left:2px solid var(--blue);padding:11px 13px;border-radius:var(--radius);}
  .log-entry.romance{border-left-color:var(--pink);}
  .tierline{font-size:11px;letter-spacing:.06em;text-align:center;font-family:'IBM Plex Mono',monospace;}
  .tierline.great{color:#8fd68f;} .tierline.bad{color:#e39a92;} .tierline.normal{color:var(--text-dim2);}
  .delta-row{display:flex;gap:10px;flex-wrap:wrap;font-family:'IBM Plex Mono',monospace;font-size:11.5px;}
  .delta{padding:3px 8px;border-radius:20px;border:1px solid var(--line);color:var(--text-dim);}
  .delta.pos{color:#8fd68f;border-color:#2d4a2d;} .delta.neg{color:#e39a92;border-color:#4a2d2d;}
  .careerlog summary{font-size:11px;color:var(--text-dim2);letter-spacing:.1em;cursor:pointer;padding:6px 0;}
  .careerlog .items{display:flex;flex-direction:column;gap:6px;max-height:180px;overflow-y:auto;padding:8px 0 2px;}
  .careerlog .item{font-size:11.5px;color:var(--text-dim2);line-height:1.6;border-bottom:1px dashed var(--line);padding-bottom:6px;}
  .careerlog .item b{color:var(--text-dim);font-weight:500;}
  .end-badge{text-align:center;padding:22px 14px 18px;}
  .end-badge .rank-final{width:64px;height:64px;margin:0 auto 12px;border:2px solid var(--yellow);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;}
  .end-badge h2{font-size:22px;font-weight:900;margin:0 0 6px;}
  .end-badge .sub{font-size:12px;color:var(--text-dim);font-family:'IBM Plex Mono',monospace;}
  .end-body{font-size:13.5px;line-height:1.85;color:var(--text-dim);}
  .final-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
  .fs-item{background:var(--bg);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;}
  .fs-item .n{font-family:'IBM Plex Mono',monospace;font-size:19px;font-weight:600;}
  .fs-item .l{font-size:10.5px;color:var(--text-dim2);margin-top:2px;}
  ::-webkit-scrollbar{width:6px;height:6px;} ::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px;}
  .feature-strip{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.feature-chip{border:1px solid var(--line);background:var(--bg2);padding:5px 8px;border-radius:999px;font-size:10.5px;color:var(--text-dim)}
  .feature-chip b{color:var(--text);margin-left:3px}.npc-card{border:1px solid #34404d;background:#10151c;padding:12px;margin:10px 0}.npc-head{display:flex;justify-content:space-between;gap:8px}.npc-name{font-weight:800}.npc-meta{font-size:10px;color:var(--text-dim2);font-family:'IBM Plex Mono',monospace}.npc-rel{margin-top:7px;height:5px;background:#202731}.npc-rel i{display:block;height:100%;background:var(--blue)}
  .achievement-box{border-top:1px solid var(--line);margin-top:14px;padding-top:12px}.achievement-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-top:8px}.ach{border:1px solid var(--line);padding:8px;background:var(--bg2);opacity:.42}.ach.unlocked{opacity:1;border-color:#62511d}.ach .ico{font-size:18px}.ach .nm{font-size:11px;font-weight:700}.ach .ds{font-size:9.5px;color:var(--text-dim2);line-height:1.35;margin-top:2px}.ach.unlocked .ds{color:var(--text-dim)}
  .npc-list{display:flex;flex-direction:column;gap:8px;margin-top:10px}.panel-title{font-size:10px;letter-spacing:.12em;color:var(--text-dim2);font-family:'IBM Plex Mono',monospace;margin-top:12px}

</style>
</head>
<body>
<div class="app">
  <div class="shell-head"><span class="tag mono">POLICE LIFE · 警察人生模擬程式</span><div class="badge">警</div></div>
  <div class="statusbar" id="statusbar"></div>
  <main id="screen"></main>
</div>

<script>
(function(){
  "use strict";

  /* ================= RNG ================= */
  function makeRng(seedStr){
    let h = 1779033703 ^ seedStr.length;
    for (let i = 0; i < seedStr.length; i++) {
      h = Math.imul(h ^ seedStr.charCodeAt(i), 3432918353);
      h = (h << 13) | (h >>> 19);
    }
    return function(){
      h = Math.imul(h ^ (h >>> 16), 2246822507);
      h = Math.imul(h ^ (h >>> 13), 3266489909);
      h ^= h >>> 16;
      return (h >>> 0) / 4294967296;
    };
  }
  const ALPHABET = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  function genSeed(len){ len=len||8; let s=""; for(let i=0;i<len;i++) s+=ALPHABET[Math.floor(Math.random()*ALPHABET.length)]; return s; }
  function clamp(v){ return Math.max(0, Math.min(99, Math.round(v))); }
  function clamp01(v){ return Math.max(0.05, Math.min(0.95, v)); }

  /* ================= OUTCOME VARIANCE SYSTEM ================= */
  /* Every non-milestone choice rolls a tier so identical choices can still play out differently. */
  function rollOutcome(rng){
    const r = rng();
    if (r<0.15) return {tier:'great', mult:1.5};
    if (r<0.65) return {tier:'normal', mult:1.0};
    if (r<0.90) return {tier:'minor', mult:0.55};
    return {tier:'bad', mult:-0.35};
  }
  function scaleEffects(effects, mult){
    const out = {};
    Object.keys(effects||{}).forEach(k=>{ out[k] = Math.round(effects[k]*mult); });
    return out;
  }
  const OUTCOME_LINES = {
    academy:{
      great:['教官當眾稱讚你的表現，同期都對你另眼相看。','這次的努力超出預期，讓你信心大增。'],
      normal:['一切照計畫進行，沒有太多意外。','日子按表操課地過去了。'],
      minor:['過程有點手忙腳亂，效果打了折扣。','比預期累了不少，成效普普。'],
      bad:['一個不小心捅了小婁子，被學長電了一頓。','熬夜的代價，隔天精神很差，表現失常。'],
    },
    duty:{
      great:['處理得漂亮，主管當場記了一支嘉獎。','意外立了功，同事都對你刮目相看。'],
      normal:['事情照著你的判斷落幕，沒有太多意外。','過程雖然瑣碎，但總算順利收尾。'],
      minor:['過程有點手忙腳亂，還好沒釀成大錯。','效果比預期打了折扣。'],
      bad:['計畫不如預期，你被上級唸了一頓。','出了點小差錯，讓你灰頭土臉，還得寫報告。'],
    },
    senior:{
      great:['薑是老的辣，你的經驗這次派上大用場。','老將出馬，表現讓年輕人心服口服。'],
      normal:['一切按部就班，沒有太多波瀾。','平順地過了這一關。'],
      minor:['體力終究不比從前，這次做得有點吃力。','比想像中費勁，回家累得倒頭就睡。'],
      bad:['年紀真的不饒人，這次栽了個小跟頭。','舊傷隱隱作痛，提醒你已經不是當年的自己。'],
    },
    romance:{
      great:['這件事讓兩人的感情更上一層樓。','對方看見了你難得的用心，格外感動。'],
      normal:['日子照舊，感情維持在一個平穩的狀態。','沒有太大起伏，就是平淡的相處日常。'],
      minor:['小小的誤會讓氣氛有點尷尬。','溝通不太順暢，留下一點小疙瘩。'],
      bad:['一句話說得不夠好，讓對方真的動氣了。','這件事，成了往後偶爾被翻出來的舊帳。'],
    },
  };
  function pickLine(category, tier, rng){
    const arr = OUTCOME_LINES[category][tier];
    return arr[Math.floor(rng()*arr.length)];
  }
  const TIER_LABEL = {great:'順利 · 超乎預期', normal:'', minor:'', bad:'不順 · 出了狀況'};

  const MILESTONE_VARIANT_LINES = {
    grad:{great:'新單位對你的第一印象很好，主管特別交辦重要任務給你磨練。', normal:'報到後一切照表操課，日子按部就班地展開。', bad:'磨合期不太順利，你被貼了「菜鳥」標籤好一陣子。'},
    case1:{great:'案件落幕後，你的處理方式在同儕間傳開，風評不錯。', normal:'案子結了，日子照舊，沒有太多漣漪。', bad:'消息不知怎麼走漏，讓你在分局裡多了些流言蜚語。'},
    midlife:{great:'這件事你處理得漂亮，連督察都私下稱讚你的判斷。', normal:'事情這樣過去了，生活恢復平靜。', bad:'這件事在分局裡傳開，你發現自己被有些人另眼相待。'},
  };
  function rollMilestoneVariant(rng){
    const r = rng();
    if (r<0.25) return 'great';
    if (r<0.8) return 'normal';
    return 'bad';
  }

  /* ================= DATA ================= */
  const RANKS = ['警專學生','警員','資深警員','巡佐','巡官','警正','分局長','警察局長'];
  const RETIRE_AGE = 55;
  const PARTNER_NAMES = ['雨柔','家豪','怡君','冠宇','思穎','建宏','佳玲','俊傑','詩涵','柏翰','宜蓁','彥廷'];

  const TRACKS = [
    {id:'detective', name:'刑事鑑識組', icon:'🔍', desc:'追查真相，靠腦不靠拳頭。', bonus:{偵查:12}},
    {id:'patrol',    name:'行政巡邏組', icon:'🚓', desc:'街頭第一線，人情練達即文章。', bonus:{人脈:12}},
    {id:'traffic',   name:'交通警察組', icon:'🚦', desc:'風吹日曬雨淋，體力是本錢。', bonus:{體能:12}},
    {id:'security',  name:'保安維安組', icon:'🛡️', desc:'鎮暴維安第一線，紀律至上。', bonus:{體能:8,操守:4}},
  ];

  const ACADEMY_POOL = [
    {id:'a1', title:'入學適應', text:s=>'凌晨五點的哨音劃破宿舍，教官的口令聲迴盪在操場上。你該把時間投資在哪裡？',
      choices:[
        {label:'凌晨加練體能', effects:{體能:7,操守:1}, salary:5},
        {label:'把行政法典啃到滾瓜爛熟', effects:{偵查:6,操守:2}, salary:5},
        {label:'混熟班上每個同學的背景', effects:{人脈:7,操守:-1}, salary:5},
      ]},
    {id:'a2', title:'班代改選', text:s=>'班上要選一位班代負責跟教官溝通，同學們的眼光落在你身上。',
      choices:[
        {label:'接下班代，扛起責任', effects:{人脈:5,操守:3,體能:-1}, salary:5},
        {label:'推薦別人，自己專心讀書', effects:{偵查:3}, salary:0},
        {label:'半推半就當了副班代', effects:{人脈:2}, salary:0},
      ]},
    {id:'a3', title:'宿舍夜衝', text:s=>'室友揪你半夜翻牆出去買鹹酥雞，被抓到肯定會記過。',
      choices:[
        {label:'豁出去，跟大家一起去', effects:{人脈:4,操守:-3}, salary:0},
        {label:'勸大家別冒險，自己留下讀書', effects:{操守:3,人脈:-2}, salary:0},
        {label:'裝睡，假裝什麼都不知道', effects:{}, salary:0},
      ]},
    {id:'a4', title:'術科考核', text:s=>'射擊與逮捕術的期中考核在即，教官說這是當警察的基本功。',
      choices:[
        {label:'苦練射擊，槍法要準', effects:{偵查:5,體能:-1}, salary:5},
        {label:'苦練逮捕術，體能要夠', effects:{體能:6}, salary:5},
        {label:'兩邊都馬虎應付', effects:{體能:-2,偵查:-2}, salary:0},
      ]},
    {id:'a5', title:'警專運動會', text:s=>'一年一度的班際運動會，班導希望你能代表班上出賽拿面子。',
      choices:[
        {label:'代表班上出賽拚成績', effects:{體能:5,人脈:3}, salary:0},
        {label:'留在後勤幫忙張羅', effects:{人脈:4}, salary:0},
        {label:'請假留在寢室讀書', effects:{偵查:3,人脈:-2}, salary:0},
      ]},
  ];

  const DUTY_POOL = [

  function checkAchievements(s){

  function achievementCount(s){ return ACHIEVEMENTS.filter(a=>s.achievements&&s.achievements[a.id]).length; }
  function achievementsHTML(s, compact=false){

  /* ================= STATE ================= */
  let state = null;

  function initState(seedStr, name, trackId){
    const rng = makeRng(seedStr);
    const track = TRACKS.find(t=>t.id===trackId) || TRACKS[0];
    const stats = {體能:0,偵查:0,人脈:0,操守:0};
    Object.keys(stats).forEach(k=>{ stats[k] = clamp(Math.round(16 + rng()*13) + (track.bonus[k]||0)); });
    return {
      seed: seedStr, rng: rng, name: name || '無名警員', track: track,
      age: 18, year: 2026, rankIdx: 1, salary: 0, stats: stats,
      relStatus:'single', relStat:50, partnerName:null, kids:0,
      mode:'career', extendRemaining:0, flags: {}, log: [],
      counters:{sudden:0,riskySuccess:0,npcEvents:0}, achievements:{},
      colleagues: [
        {name:COLLEAGUE_NAMES[Math.floor(rng()*COLLEAGUE_NAMES.length)], role:COLLEAGUE_ROLES[Math.floor(rng()*COLLEAGUE_ROLES.length)], rank:'警員', relation:55, metAge:18},
        {name:COLLEAGUE_NAMES[Math.floor(rng()*COLLEAGUE_NAMES.length)], role:COLLEAGUE_ROLES[Math.floor(rng()*COLLEAGUE_ROLES.length)], rank:'警員', relation:50, metAge:19},
        {name:COLLEAGUE_NAMES[Math.floor(rng()*COLLEAGUE_NAMES.length)], role:COLLEAGUE_ROLES[Math.floor(rng()*COLLEAGUE_ROLES.length)], rank:'警員', relation:45, metAge:20}
      ],
      used:{academy:[],duty:[],senior:[],romSingle:[],romDating:[],romNoKids:[],romKids:[],romAny:[],romDiv:[],npc:[],sudden:[]},
      fileNumber: String(1000 + Math.floor(rng()*8999)),
    };
  }

  function overall(s){ return Math.round((s.stats.體能 + s.stats.偵查 + s.stats.人脈)/3); }
  function rankName(s){ return RANKS[s.rankIdx]; }
  function relLabel(s){
    if (s.relStatus==='single') return '單身';
    if (s.relStatus==='dating') return `交往中（與 ${s.partnerName}）`;
    if (s.relStatus==='married') return `已婚（與 ${s.partnerName}）${s.kids>0?' · 育有子女':''}`;
    if (s.relStatus==='divorced') return `離異${s.kids>0?' · 獨力扶養子女':''}`;
    return '單身';
  }
  function applyEffects(s, effects){
    const applied = {};
    Object.keys(effects||{}).forEach(k=>{
      if (['操守','體能','偵查','人脈'].includes(k)){
        const before = s.stats[k]; s.stats[k] = clamp(s.stats[k] + effects[k]); applied[k] = s.stats[k]-before;
      }
    });
    return applied;
  }
  function pushLog(text){ state.log.push({age: state.age, text: text}); }
  function drawFromPool(pool, usedArr){
    let unused = pool.filter(e=>usedArr.indexOf(e.id)===-1);
    if (!unused.length){ usedArr.length = 0; unused = pool.slice(); }
    const chosen = unused[Math.floor(state.rng()*unused.length)];
    usedArr.push(chosen.id);
    return chosen;
  }
  function romancePoolFor(s){
    if (s.relStatus==='single') return {pool:ROMANCE_SINGLE, used:s.used.romSingle};
    if (s.relStatus==='dating') return {pool:ROMANCE_DATING, used:s.used.romDating};
    if (s.relStatus==='married'){
      const bag = s.kids>0 ? ROMANCE_MARRIED_KIDS.concat(ROMANCE_MARRIED_ANY) : ROMANCE_MARRIED_NOKIDS.concat(ROMANCE_MARRIED_ANY);
      return {pool:bag, used:s.used.romAny};
    }
    if (s.relStatus==='divorced' && s.kids>0) return {pool:ROMANCE_DIVORCED, used:s.used.romDiv};
    return null;
  }

  const MILESTONE_AGES = {
    21: s=>milestoneGrad(s),
    26: s=>milestoneExam(s,3,'升遷考試・巡佐','巡佐考試在即。你可以拚死拚活準備筆試，也可以靠年資與人脈慢慢熬。'),

    40: s=>milestoneMidlife(s),
  };


  function drawNpcRound(s){
    const npcIndex=Math.floor(s.rng()*s.colleagues.length);
    const npc=s.colleagues[npcIndex];
    const ev=drawFromPool(NPC_EVENT_POOL,s.used.npc);
    return {kind:'npc', category:'npc', npcIndex, label:ev.title, fileNo:`AGE ${s.age} · 同袍交情`, romance:false, title:ev.title, text:ev.text(s,npc), choices:ev.choices};
  }
  function drawSuddenRound(s){
    const ev=drawFromPool(SUDDEN_EVENT_POOL,s.used.sudden);
    return {kind:'sudden', category:'sudden', label:ev.title, fileNo:`AGE ${s.age} · 突發勤務`, romance:false, title:ev.title, text:ev.text, choices:ev.choices};
  }

  function getRound(s){
    if (MILESTONE_AGES[s.age]) return MILESTONE_AGES[s.age](s);
    if (s.age>=18 && s.age<=20){
      const ev = drawFromPool(ACADEMY_POOL, s.used.academy);
      return {kind:'normal', category:'academy', label:ev.title, fileNo:`AGE ${s.age} · 警專養成`, romance:false, title:ev.title, text:ev.text(s), choices:ev.choices};
    }
    // 突發事件：約22%，會取代當年的一般勤務，讓每一年都有意外可能。
    if (s.rng() < 0.22){ return drawSuddenRound(s); }
    // NPC同事事件：約18%，隨著人脈與年資提升更容易遇到。
    const npcChance = s.stats.人脈>=70 ? 0.24 : 0.18;
    if (s.rng() < npcChance){ return drawNpcRound(s); }
    const romChance = s.age>=48 ? 0.28 : 0.34;
    if (s.age>=22 && s.rng() < romChance){
      const rp = romancePoolFor(s);
      if (rp){
        const ev = drawFromPool(rp.pool, rp.used);
        return {kind:'normal', category:'romance', label:ev.title, fileNo:`AGE ${s.age} · 私人時光`, romance:true, title:ev.title, text:ev.text(s), choices:ev.choices};
      }
    }
    if (s.age>=48){
      const ev = drawFromPool(SENIOR_POOL, s.used.senior);
      const choices = typeof ev.choices==='function' ? ev.choices(s) : ev.choices;
      const text = typeof ev.text==='function' ? ev.text(s) : ev.text;
      return {kind:'normal', category:'senior', label:ev.title, fileNo:`AGE ${s.age} · 資深歲月`, romance:false, title:ev.title, text:text, choices:choices};
    }
    const ev = drawFromPool(DUTY_POOL, s.used.duty);
    return {kind:'normal', category:'duty', label:ev.title, fileNo:`AGE ${s.age} · 勤務日常`, romance:false, title:ev.title, text:ev.text(s), choices:ev.choices};
  }

      <div class="relline">♥ ${relLabel(s)}</div>

  }
  function statItem(label, val, cls){
    return `<div class="statitem"><div class="lbl"><span>${label}</span><b>${val}</b></div><div class="track"><div class="fill ${cls}" style="width:${val}%"></div></div></div>`;

      const grid = document.getElementById('trackGrid');

          selectedTrack = btn.dataset.id;
          grid.querySelectorAll('.track-opt').forEach(b=>b.classList.remove('sel'));

        });
      });
      document.getElementById('reseedBtn').addEventListener('click', ()=>{ seed = genSeed(); document.getElementById('seedDisplay').textContent = seed; });
      document.getElementById('importBtn').addEventListener('click', ()=>{

        checkAchievements(state);
        screenRound();
      });
    }
    draw();
  }

  function screenRound(){
    renderStatus();
    const s = state;
    if (s.mode==='career' && s.age>RETIRE_AGE){ screenRetireDecision(); return; }
    const round = getRound(s);
    const totalSpan = RETIRE_AGE-18+1;
    const doneSpan = s.mode==='extend' ? totalSpan : (s.age-18+1);
    screen.innerHTML = `
      <div class="stageprog mono"><span>${s.mode==='extend'?'延任生涯':`第 ${doneSpan} / ${totalSpan} 年`}</span><span>${round.fileNo}</span></div>
      <div class="file-card ${round.romance?'romance':''}">
        <div class="file-num mono">FILE No. ${s.fileNumber}-${s.age} ／ ${round.label}</div>
        <div class="file-title">${round.title}</div>
        <div class="file-body">${round.text}</div>
      </div>
      ${round.kind==='npc'?`<div class="panel-title">同袍資料</div>${colleaguesHTML(s)}`:''}
      <div class="choices" id="choiceWrap"></div>
      ${careerLogHTML()}
    `;
    const wrap = document.getElementById('choiceWrap');
    round.choices.forEach(c=>{
      const btn = document.createElement('button');
      btn.className = 'choice-btn';
      btn.innerHTML = `${c.label}${c.note?`<span class="note">${c.note}</span>`:''}`;
      btn.addEventListener('click', ()=> resolveRound(round, c));
      wrap.appendChild(btn);
    });
  }

  function resolveRound(round, choice){
    const s = state;
    let stampHTML = '', tierLineHTML = '', resultText = '', applied = {}, salaryDelta = 0, relDelta = 0;

    if (round.kind==='npc'){
      const npc = s.colleagues[round.npcIndex ?? 0];
      const outcome = rollOutcome(s.rng);
      const scaled = scaleEffects(choice.effects, outcome.mult);
      applied = applyEffects(s, scaled);
      salaryDelta = Math.round((choice.salary||0)*outcome.mult);
      s.salary += salaryDelta;
      relDelta = Math.round((choice.npc||0)*outcome.mult);
      npc.relation = clamp(npc.relation + relDelta);
      s.counters.npcEvents += 1;
      if (npc.relation>=85) s.flags.npc_best = true;
      resultText = `${choice.label}——${npc.name}記住了你的選擇。${pickLine('duty', outcome.tier, s.rng)}`;
      stampHTML = `<div class="stamp ${outcome.tier==='bad'?'bad':'gold'}">同袍 · ${npc.relation>=85?'摯友':'交情+'+relDelta}</div>`;
      tierLineHTML = outcome.tier==='great'||outcome.tier==='bad' ? `<div class="tierline ${outcome.tier}">${TIER_LABEL[outcome.tier]}</div>` : '';
    } else if (round.kind==='sudden'){
      const risky = !!choice.risky;
      if (risky && s.rng()<0.04){
        applied = applyEffects(s, choice.effects);
        salaryDelta = choice.salary||0; s.salary += salaryDelta;
        s.flags.duty_death = true;
        s.counters.sudden += 1;
        pushLog(`【突發勤務｜${round.label}】${choice.label}。執勤中不幸殉職。`);
        finishRound(`<div class="stamp bad">突發 · 殉職</div>`, '', '這次突發勤務成為你人生最後一場任務。', applied, salaryDelta, 0, round); return;
      }
      const outcome = rollOutcome(s.rng);
      const scaled = scaleEffects(choice.effects, outcome.mult);
      applied = applyEffects(s, scaled);
      salaryDelta = Math.round((choice.salary||0)*outcome.mult); s.salary += salaryDelta;
      s.counters.sudden += 1;
      if (risky) s.counters.riskySuccess += 1;
      if (choice.flag) s.flags[choice.flag] = true;
      resultText = `${choice.label}——${pickLine('duty', outcome.tier, s.rng)}`;
      stampHTML = `<div class="stamp ${outcome.tier==='bad'?'bad':'gold'}">突發 · ${outcome.tier==='great'?'漂亮處置':'事件處理'}</div>`;
      tierLineHTML = outcome.tier==='great'||outcome.tier==='bad' ? `<div class="tierline ${outcome.tier}">${TIER_LABEL[outcome.tier]}</div>` : '';
    } else if (round.kind==='exam'){
      applied = applyEffects(s, choice.effects);
      s.salary += (choice.salary||0);
      const chance = clamp01((s.stats.偵查*0.4 + s.stats.人脈*0.35 + s.stats.操守*0.15 + s.stats.體能*0.10)/99 + (choice.examBonus||0));
      if (s.rng() < chance){
        s.rankIdx = Math.min(round.rankTarget, RANKS.length-1);
        s.salary += 60;
        stampHTML = `<div class="stamp">考核 · 及格</div>`;
        resultText = `放榜當天，你的名字出現在合格名單上——晉任「${rankName(s)}」。`;
      } else {
        stampHTML = `<div class="stamp bad">考核 · 未通過</div>`;
        resultText = `差了臨門一腳，這次考核未能通過。主管拍拍你的肩：「下一次。」`;
        applied = Object.assign(applied, applyEffects(s, {偵查:1}));
      }
    } else if (round.kind==='milestone'){
      applied = applyEffects(s, choice.effects);
      s.salary += (choice.salary||0);
      if (choice.flag) s.flags[choice.flag] = true;
      const bad = choice.flag && choice.flag.indexOf('corrupt')>-1;
      const vt = rollMilestoneVariant(s.rng);
      const vLine = MILESTONE_VARIANT_LINES[round.mkey][vt];
      const nudge = vt==='great'?2:(vt==='bad'?-2:0);
      if (nudge){ const extra = applyEffects(s, {人脈:nudge}); applied.人脈 = (applied.人脈||0)+(extra.人脈||0); }
      resultText = vLine;
      stampHTML = `<div class="stamp ${bad?'bad':(vt==='great'?'gold':'')}">案件 · ${bad?'列管':'結案'}</div>`;
    } else if (round.romance){
      const outcome = rollOutcome(s.rng);
      const scaled = scaleEffects(choice.effects, outcome.mult);
      applied = applyEffects(s, scaled);
      salaryDelta = Math.round((choice.salary||0)*outcome.mult);
      s.salary += salaryDelta;
      relDelta = Math.round((choice.rel||0)*outcome.mult);

      if (choice.setStatus==='dating'){
        if (outcome.tier==='bad'){
          resultText = `你鼓起勇氣表明心意，但對方委婉拒絕了，這份心意暫時只能放在心裡。`;
          stampHTML = `<div class="stamp bad">告白 · 被拒</div>`;
          relDelta = Math.min(relDelta, 1);
        } else {
          s.partnerName = PARTNER_NAMES[Math.floor(s.rng()*PARTNER_NAMES.length)];
          s.relStatus = 'dating';
          resultText = `你和${s.partnerName}開始交往了。`;
          stampHTML = `<div class="stamp pink">感情 · 交往中</div>`;
        }
      } else if (choice.setStatus==='married'){
        const proposeChance = clamp01((s.relStat/99) * (outcome.tier==='bad'?0.3:1));
        if (s.rng() < proposeChance){
          s.relStatus = 'married';
          resultText = `${s.partnerName}答應了你的求婚，你們決定攜手共度往後的日子。`;
          stampHTML = `<div class="stamp pink">感情 · 已婚</div>`;
        } else {
          resultText = `你鼓起勇氣求婚，${s.partnerName}卻說還沒準備好。這段關係還需要多一點時間醞釀。`;
          stampHTML = `<div class="stamp bad">求婚 · 被拒</div>`;
          relDelta -= 8;
        }
      } else if (choice.setStatus==='single'){
        resultText = `你和${s.partnerName||'對方'}分手了。感情這條路，只能重新開始。`;
        stampHTML = `<div class="stamp bad">感情 · 分手</div>`;
        s.relStatus = 'single'; s.partnerName = null;
      } else {
        resultText = `${choice.label}——${pickLine('romance', outcome.tier, s.rng)}`;
        if (outcome.tier==='great') stampHTML = `<div class="stamp pink">感情 · 昇溫</div>`;
      }
      if (choice.addKid){
        s.kids += 1;
        resultText += ` 不久後，你們迎來了第一個孩子。`;
        stampHTML = `<div class="stamp pink">家庭 · 添丁</div>`;
      }
      s.relStat = clamp(s.relStat + relDelta);
      tierLineHTML = outcome.tier==='great'||outcome.tier==='bad' ? `<div class="tierline ${outcome.tier}">${TIER_LABEL[outcome.tier]}</div>` : '';
    } else {
      // normal duty / academy / senior
      if (choice.risky){
        const dieRoll = s.rng();
        if (dieRoll < 0.04){
          applied = applyEffects(s, choice.effects);
          s.salary += (choice.salary||0);
          s.flags.duty_death = true;
          stampHTML = `<div class="stamp bad">殉職</div>`;
          resultText = `執行圍捕任務時，你為了掩護後進而身受重傷，最終不治。你的名字，將被刻在警察紀念碑上。`;
          pushLog(`【${round.label}】${choice.label}。${resultText}`);
          finishRound(stampHTML, '', resultText, applied, 0, 0, round);
          return;
        }
      }
      const outcome = rollOutcome(s.rng);
      const scaled = scaleEffects(choice.effects, outcome.mult);
      applied = applyEffects(s, scaled);
      salaryDelta = Math.round((choice.salary||0)*outcome.mult);
      s.salary += salaryDelta;
      resultText = `${choice.label}——${pickLine(round.category, outcome.tier, s.rng)}`;
      if (outcome.tier==='great') stampHTML = `<div class="stamp gold">${TIER_LABEL.great}</div>`;
      else if (outcome.tier==='bad') stampHTML = `<div class="stamp bad">${TIER_LABEL.bad}</div>`;
      tierLineHTML = (outcome.tier==='normal'||outcome.tier==='minor') ? '' : '';
    }

    checkAchievements(s);
    pushLog(`【${round.label}】${choice.label}。${resultText}`);
    finishRound(stampHTML, tierLineHTML, resultText, applied, salaryDelta, relDelta, round);
  }

  function finishRound(stampHTML, tierLineHTML, resultText, applied, salaryDelta, relDelta, round){
    const s = state;
    screen.innerHTML = `
      <div class="resolve-wrap">
        ${stampHTML}
        <div class="log-entry ${round.romance?'romance':''}">${resultText}</div>
        ${deltaRowHTML(applied, salaryDelta, relDelta)}
        <button class="btn-primary" id="continueBtn">繼續 ▸</button>
      </div>
      ${careerLogHTML()}
    `;
    renderStatus();
    document.getElementById('continueBtn').addEventListener('click', ()=>{
      if (s.flags.duty_death){ screenEnding(); return; }
      if (s.mode==='career'){ s.age += 1; s.year += 1; checkAchievements(s); screenRound(); }
      else { s.extendRemaining -= 1; s.age += 1; s.year += 1; if (s.extendRemaining<=0){ screenEnding(); } else { screenRound(); } }
    });
  }

  function deltaRowHTML(deltas, salary, rel){
    const chips = Object.keys(deltas||{}).filter(k=>deltas[k]!==0).map(k=>{
      const v = deltas[k]; return `<span class="delta ${v>0?'pos':'neg'}">${k} ${v>0?'+':''}${v}</span>`;
    });
    if (salary) chips.push(`<span class="delta ${salary>0?'pos':'neg'}">薪資 ${salary>0?'+':''}${salary}萬</span>`);
    if (rel) chips.push(`<span class="delta ${rel>0?'pos':'neg'}">感情 ${rel>0?'+':''}${rel}</span>`);
    if (!chips.length) return '';
    return `<div class="delta-row">${chips.join('')}</div>`;
  }

  const RETIRE_CHOICES = [
    {label:'申請退休，安享天年', effects:{}, salary:30, key:'early'},
    {label:'拚到屆齡最後一刻，力求最高階級', effects:{偵查:3,人脈:3}, salary:60, key:'push', bonus:0.16},
    {label:'婉拒退休，接受借調擔任顧問', note:'極少數機會', effects:{操守:2,人脈:4}, salary:100, key:'advise'},
  ];

  function screenRetireDecision(){
    renderStatus();
    screen.innerHTML = `
      <div class="stageprog mono"><span>退休抉擇</span><span>AGE ${state.age} · 生涯終章</span></div>
      <div class="file-card">
        <div class="file-num mono">FILE No. ${state.fileNumber}-F ／ 退休抉擇</div>
        <div class="file-title">退休抉擇</div>
        <div class="file-body">你已符合申請退休的資格。是要見好就收、含飴弄孫，還是拚到最後一刻，爭取生涯最高峰？</div>
      </div>
      <div class="choices" id="choiceWrap"></div>
      ${careerLogHTML()}
    `;
    const wrap = document.getElementById('choiceWrap');
    RETIRE_CHOICES.forEach(c=>{
      const btn = document.createElement('button');
      btn.className = 'choice-btn';
      btn.innerHTML = `${c.label}${c.note?`<span class="note">${c.note}</span>`:''}`;
      btn.addEventListener('click', ()=> resolveRetire(c));
      wrap.appendChild(btn);
    });
  }

  function resolveRetire(choice){
    const s = state;
    const applied = applyEffects(s, choice.effects);
    s.salary += (choice.salary||0);
    let resultText = '';
    if (choice.key==='push'){
      const chance = clamp01((overall(s)*0.6 + s.stats.人脈*0.4)/99 + (choice.bonus||0));
      if (s.rng() < chance && s.rankIdx < RANKS.length-1){
        s.rankIdx += 1;
        resultText = `拚到最後一刻，你在退休前意外獲得最後一次拔擢，以「${rankName(s)}」身分卸下警徽。`;
      } else {
        resultText = `你在崗位上撐到了屆齡的最後一天，階級停在「${rankName(s)}」，但沒有人能說你不夠拚。`;
      }
      s.mode='extend'; s.extendRemaining=3; s.flags.usedExtend=true;
    } else if (choice.key==='advise'){
      resultText = `你婉拒了退休，接受借調成為顧問，繼續在會議室裡發揮多年辦案經驗。`;
      s.mode='extend'; s.extendRemaining=2; s.flags.usedExtend=true;
    } else {
      resultText = `你在核准的第一天就送出退休申請，準備把時間留給自己與${s.relStatus==='married'?s.partnerName:'家人'}。`;
      s.mode='extend'; s.extendRemaining=0;
    }
    pushLog(`【退休抉擇】${choice.label}。${resultText}`);
    screen.innerHTML = `
      <div class="resolve-wrap">
        <div class="stamp gold">生涯 · ${s.extendRemaining>0?'延任':'完結'}</div>
        <div class="log-entry">${resultText}</div>
        ${deltaRowHTML(applied, choice.salary)}
        <button class="btn-primary" id="continueBtn">${s.extendRemaining>0?'繼續 ▸':'查看生涯總評 ▸'}</button>
      </div>
    `;
    document.getElementById('continueBtn').addEventListener('click', ()=>{
      if (s.extendRemaining>0){ screenRound(); } else { screenEnding(); }
    });
  }

  function computeEnding(s){
    const ov = overall(s);
    const integ = s.stats.操守;
    const famLine = s.relStatus==='married' ? `退休那天，陪在你身邊的是${s.partnerName}${s.kids>0?'與孩子':''}。`
      : s.relStatus==='dating' ? `退休那天，${s.partnerName}特地請假來參加你的歡送會。`
      : s.relStatus==='divorced' ? `退休那天，孩子特地回來陪你，說是要補回這些年錯過的時間。`
      : `退休那天，來的大多是同袍——這輩子，你把大半的時間都留給了這份工作。`;
    if (s.flags.duty_death){
      return {icon:'🎖️', title:'英勇殉職', sub:`追晉一階 · ${rankName(s)}`,
        body:`${s.name}在執勤中殉職，享年${s.age}歲。警察節的追思名單上，多了一個被永遠記住的名字。同袍在紀念碑前立正敬禮，家屬領取撫卹金與國家榮耀，但誰都寧願這份榮耀從未發生過。`};
    }
    if (integ <= 25 && (s.flags.corrupt || s.flags.corrupt2)){
      return {icon:'⚠️', title:'貪瀆去職', sub:`除警籍 · 末代階級 ${rankName(s)}`,
        body:`廉政署的調查小組在一次金流稽核中盯上了${s.name}。收賄的證據一項項浮出水面，最終被依貪污治罪條例起訴、除籍收押。年輕時穿上制服的驕傲，換來的是新聞跑馬燈上一閃而過的名字。`};
    }
    if (integ >= 75 && ov >= 70 && s.rankIdx >= 5){
      return {icon:'🏅', title:'警界名人堂', sub:`${rankName(s)} · 生涯薪資 ${s.salary}萬`,
        body:`${s.name}以清廉與實力走完整段警察生涯，退休典禮上擠滿了同袍與受過你幫助的市民。地方警友會將你的辦案故事寫進教材，後進口中「傳說中的前輩」，說的就是你。${famLine}`};
    }
    if (integ >= 55 && ov >= 55){
      return {icon:'🏆', title:'模範警察退休', sub:`${rankName(s)} · 生涯薪資 ${s.salary}萬`,
        body:`${s.name}在崗位上兢兢業業${s.age-18}年，沒有轟轟烈烈的傳奇，卻在每一個平凡的勤務裡守住了分寸。退休茶會上，分局長親自頒發服務獎章，感謝你這些年的堅持。${famLine}`};
    }
    if (s.rankIdx <= 1){
      return {icon:'🚓', title:'基層老兵退休', sub:`${rankName(s)} · 生涯薪資 ${s.salary}萬`,
        body:`${s.name}一輩子沒離開過第一線，官階始終沒往上爬，但轄區裡的居民都認得你的臉。退休那天，巷口的早餐店老闆特地包了一份油飯。${famLine}`};
    }
    return {icon:'📁', title:'平凡卸下警徽', sub:`${rankName(s)} · 生涯薪資 ${s.salary}萬`,
      body:`${s.name}的警察生涯沒有大起，也沒有大落。功過相抵的考績表裡，寫著一個普通人如何在制度與人情之間，勉強維持住自己的樣子。${famLine}`};
  }

  function screenEnding(){
    statusbar.classList.remove('show');
    const s = state;
    const end = computeEnding(s);
    screen.innerHTML = `
      <div class="end-badge"><div class="rank-final">${end.icon}</div><h2>${end.title}</h2><div class="sub mono">${end.sub}</div></div>
      <div class="end-body">${end.body}</div>
      <div class="final-stats">
        <div class="fs-item"><div class="n">${s.age}</div><div class="l">退役年齡</div></div>
        <div class="fs-item"><div class="n">${overall(s)}</div><div class="l">綜合評價</div></div>
        <div class="fs-item"><div class="n">${s.stats.操守}</div><div class="l">操守指數</div></div>
        <div class="fs-item"><div class="n">${s.salary}萬</div><div class="l">生涯薪資</div></div>
      </div>
      ${careerLogHTML()}
      <div class="panel-title">同袍關係</div>
      ${colleaguesHTML(s)}
      ${achievementsHTML(s,false)}
      <div class="seedrow"><span class="mono" id="seedDisplay2">種子碼：${s.seed}</span><button class="iconbtn" id="copySeed">複製</button></div>
      <button class="btn-primary" id="restartBtn">再模擬一次</button>
    `;
    document.getElementById('copySeed').addEventListener('click', ()=>{ if (navigator.clipboard) navigator.clipboard.writeText(s.seed); });
    document.getElementById('restartBtn').addEventListener('click', ()=>{ state = null; screenStart(); });
  }

  screenStart();
})();
</script>
</body>
</html>
